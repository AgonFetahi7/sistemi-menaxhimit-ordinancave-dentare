spring.application.name=dental-clinic

# Kredencialet lexohen nga .env (nese ekziston) ose nga variablat e ambientit - jo nga repository
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/dental_clinic?serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Skema krijohet manualisht nga database/schema.sql, Hibernate nuk e ndryshon
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Swagger UI: http://localhost:8080/swagger-ui.html
